<p>À l&rsquo;aide du mélangeur, composer un nouveau son à partir de deux ou trois sons différents. Dans cet exemple, la résonance d&rsquo;une attaque de contrebasse est remplacée par une tenue de cor, accordée à l&rsquo;octave.</p>
